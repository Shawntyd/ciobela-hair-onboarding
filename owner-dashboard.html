<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cio Bela — Onboarding Dashboard</title>
<style>
  :root { --gold: #c9a24b; --bg: #141414; --card: #1e1e1e; --line: #2e2e2e; --txt: #f2ede4; --dim: #a89f8d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt); font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; padding: 20px 16px 48px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; letter-spacing: 2px; text-transform: uppercase; margin: 8px 0 2px; }
  h1 span { color: var(--gold); }
  .sub { color: var(--dim); font-size: 14px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .who { font-size: 17px; font-weight: 600; }
  .email { color: var(--dim); font-size: 13px; margin: 2px 0 10px; }
  .bar { height: 8px; background: #0f0f0f; border-radius: 99px; overflow: hidden; margin: 6px 0 12px; }
  .bar > div { height: 100%; background: var(--gold); border-radius: 99px; }
  .count { font-size: 13px; color: var(--dim); margin-bottom: 10px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .mark { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; flex: none; border: 1px solid var(--dim); color: transparent; }
  .done .mark { background: var(--gold); border-color: var(--gold); color: #141414; }
  .done .lbl { color: var(--txt); }
  .lbl { color: var(--dim); }
  .det { display: block; font-size: 12px; color: var(--dim); margin-top: 2px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #141414; background: var(--gold); border-radius: 99px; padding: 4px 10px; margin-bottom: 8px; }
  .meta { color: var(--dim); font-size: 12px; margin-top: 10px; }
  input[type=password] { width: 100%; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid var(--line); background: #0f0f0f; color: var(--txt); margin-bottom: 10px; }
  button { width: 100%; padding: 13px; font-size: 16px; font-weight: 700; border: 0; border-radius: 10px; background: var(--gold); color: #141414; }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); margin-top: 10px; font-weight: 400; }
  .err { color: #e08a8a; font-size: 14px; margin-top: 10px; }
  .row { display: flex; gap: 10px; }
  .row button { margin-top: 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { width: auto; padding: 8px 14px; font-size: 14px; font-weight: 600; background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 99px; }
  .tab.on { background: var(--gold); color: #141414; border-color: var(--gold); }
  .svc { color: var(--gold); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
  .empty { text-align: center; color: var(--dim); padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Cio Bela <span>Owner</span></h1>
  <div class="sub">Onboarding progress</div>

  <div id="lock" class="card" hidden>
    <div class="who" style="margin-bottom:10px">Enter your owner password</div>
    <input type="password" id="key" placeholder="Owner password" autocomplete="off">
    <button id="unlock">Unlock dashboard</button>
    <div class="err" id="lockerr" hidden>That password didn't work. Try again.</div>
  </div>

  <div class="tabs" id="tabs" hidden></div>
  <div id="board" hidden></div>
  <div class="row" id="foot" hidden>
    <button class="ghost" id="refresh">Refresh</button>
    <button class="ghost" id="backup">Download backup</button>
    <button class="ghost" id="signout">Sign out</button>
  </div>
</div>

<script>
(function () {
  var WORKER = 'https://ciobela-onboarding.shawntyd96.workers.dev';
  var ITEMS = [
    ['contract_signed', 'Contractor agreement', 'contract'],
    ['payment_signed', 'Payment authorization', 'payment'],
    ['w9_signed', 'W-9 packet', 'w9'],
    ['standards_signed', 'Brand standards', 'standards'],
    ['id_uploaded', 'ID upload', 'idupload'],
    ['release_signed', 'Photo release', 'release'],
    ['emergency_signed', 'Emergency contact', 'emergency'],
    ['bio_done', 'Bio', 'bio'],
    ['legal_done', 'Legal review', 'legal']
  ];
  var lock = document.getElementById('lock'),
      board = document.getElementById('board'),
      foot = document.getElementById('foot'),
      keyInput = document.getElementById('key'),
      lockerr = document.getElementById('lockerr');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function fmtDate(iso) {
    try {
      return new Date(iso).toLocaleString('en-US', { timeZone: 'America/Chicago', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    } catch (e) { return ''; }
  }

  function fmtDur(s) {
    s = Math.round(s || 0);
    if (s < 60) return s + ' sec';
    var m = Math.round(s / 60);
    return m < 60 ? m + ' min' : Math.floor(m / 60) + ' hr ' + (m % 60) + ' min';
  }

  function getKey() {
    var q = new URLSearchParams(location.search).get('key');
    if (q) { try { localStorage.setItem('ciobela_admin_key', q); } catch (e) {} return q; }
    try { return localStorage.getItem('ciobela_admin_key') || ''; } catch (e) { return ''; }
  }

  function load(key) {
    lockerr.hidden = true;
    fetch(WORKER + '/admin?key=' + encodeURIComponent(key))
      .then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); })
      .then(function (j) {
        if (!j || !Array.isArray(j.data)) throw new Error('bad');
        try { localStorage.setItem('ciobela_admin_key', key); } catch (e) {}
        VISITORS = Array.isArray(j.visitors) ? j.visitors : [];
        render(j.data);
      })
      .catch(function () {
        try { localStorage.removeItem('ciobela_admin_key'); } catch (e) {}
        board.hidden = true; foot.hidden = true; lock.hidden = false; lockerr.hidden = false;
      });
  }

  var SVC = { all: 'All', nail: 'Nail', waxing: 'Waxing', lash: 'Lash', hair: 'Hair', visitors: 'Visitors' };
  var ALL = [], VISITORS = [], filter = 'all';
  function drawTabs() {
    var tabs = document.getElementById('tabs');
    tabs.hidden = false;
    tabs.innerHTML = Object.keys(SVC).map(function (k) {
      return '<button class="tab' + (k === filter ? ' on' : '') + '" data-k="' + k + '">' + SVC[k] + '</button>';
    }).join('');
    Array.prototype.forEach.call(tabs.querySelectorAll('.tab'), function (b) {
      b.onclick = function () { filter = b.getAttribute('data-k'); render(ALL); };
    });
  }

  function renderVisitors() {
    var now = Date.now(), day = 86400000;
    var today = VISITORS.filter(function (v) { return v.last && now - new Date(v.last).getTime() < day; }).length;
    var week = VISITORS.filter(function (v) { return v.last && now - new Date(v.last).getTime() < 7 * day; }).length;
    var notStarted = VISITORS.filter(function (v) { return !v.email; }).length;
    var list = VISITORS.slice().sort(function (a, b) { return (b.last || '') < (a.last || '') ? -1 : 1; });
    var head = '<div class="card"><div class="who">' + VISITORS.length + ' visitor' + (VISITORS.length === 1 ? '' : 's') + ' total</div>' +
      '<div class="count">' + today + ' in the last 24 hours · ' + week + ' in the last 7 days · ' + notStarted + ' haven\'t started</div>' +
      '<div class="meta">Each visitor is one device (a phone or computer). No names are collected until someone fills in her profile.</div></div>';
    if (!list.length) { board.innerHTML = head + '<div class="empty">No visits recorded yet.</div>'; return; }
    board.innerHTML = head + list.map(function (v) {
      return '<div class="card">' +
        (v.service ? '<div class="svc">' + esc(SVC[v.service] || v.service) + '</div>' : '') +
        '<div class="who">Visitor ' + esc(v.id) + '</div>' +
        '<div class="email">' + (v.email ? 'Signed up as ' + esc(v.email) : "Hasn't started onboarding") + '</div>' +
        '<div class="count">First visit ' + esc(fmtDate(v.first)) + ' · Last ' + esc(fmtDate(v.last)) + '</div>' +
        '<div class="count">' + esc(fmtDur(v.seconds)) + ' on page · ' + (v.visits || 0) + ' visit' + (v.visits === 1 ? '' : 's') + '</div>' +
        '</div>';
    }).join('');
  }

  function render(people) {
    ALL = people;
    lock.hidden = true; board.hidden = false; foot.hidden = false;
    drawTabs();
    if (filter === 'visitors') { renderVisitors(); return; }
    people = people.filter(function (p) { return filter === 'all' || (p.progress || {}).service === filter; });
    people.sort(function (a, b) {
      var pa = (a.progress || {}).updated_at || '', pb = (b.progress || {}).updated_at || '';
      return pb < pa ? -1 : pb > pa ? 1 : 0;
    });
    if (!people.length) { board.innerHTML = '<div class="empty">Nobody has started onboarding here yet.</div>'; return; }
    board.innerHTML = people.map(function (p) {
      var pr = p.progress || {};
      var doneCount = ITEMS.filter(function (it) { return pr[it[0]] === true; }).length;
      var pct = Math.round(doneCount / ITEMS.length * 100);
      var items = ITEMS.map(function (it) {
        var done = pr[it[0]] === true;
        var v = (p.visits || {})[it[2]];
        var doneAt = (pr.done_at || {})[it[0]];
        var detail = [];
        if (v && v.first) detail.push('Opened ' + fmtDate(v.first));
        if (v && v.seconds != null) detail.push(fmtDur(v.seconds) + ' on page');
        if (v && v.visits > 1) detail.push(v.visits + ' visits');
        if (done && doneAt) detail.push('Done ' + fmtDate(doneAt));
        return '<div class="item' + (done ? ' done' : '') + '"><span class="mark">✓</span><span class="lbl">' + esc(it[1]) +
          (detail.length ? '<span class="det">' + esc(detail.join(' · ')) + '</span>' : '') + '</span></div>';
      }).join('');
      return '<div class="card">' +
        (pr.service ? '<div class="svc">' + esc(SVC[pr.service] || pr.service) + '</div>' : '') +
        (pr.onboarding_done ? '<span class="badge">Complete</span>' : '') +
        '<div class="who">' + esc(p.name || p.email || 'Stylist') + '</div>' +
        '<div class="email">' + esc(p.email || '') + '</div>' +
        '<div class="count">' + doneCount + ' of ' + ITEMS.length + ' steps done</div>' +
        '<div class="bar"><div style="width:' + pct + '%"></div></div>' +
        items +
        '<div class="meta">Total time on onboarding pages: ' + esc(fmtDur(Object.keys(p.visits || {}).reduce(function (a, k) { return a + ((p.visits[k] || {}).seconds || 0); }, 0))) + '</div>' +
        '<div class="meta">Last activity: ' + esc(fmtDate(pr.updated_at)) + '</div>' +
        '</div>';
    }).join('');
  }

  document.getElementById('unlock').onclick = function () { load(keyInput.value.trim()); };
  keyInput.onkeydown = function (e) { if (e.key === 'Enter') load(keyInput.value.trim()); };
  document.getElementById('refresh').onclick = function () { load(getKey()); };
  document.getElementById('backup').onclick = function () {
    var key = getKey();
    fetch(WORKER + '/export?key=' + encodeURIComponent(key))
      .then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); })
      .then(function (j) {
        var blob = new Blob([JSON.stringify(j, null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'CioBela-Onboarding-Backup-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a); a.click(); a.remove();
      })
      .catch(function () { alert('Could not download the backup. Try signing out and back in.'); });
  };
  document.getElementById('signout').onclick = function () {
    try { localStorage.removeItem('ciobela_admin_key'); } catch (e) {}
    location.search = '';
  };

  var k = getKey();
  if (k) load(k); else lock.hidden = false;
})();
</script>
</body>
</html>
